services:
  nginx:
    image: nginx:alpine
    ports: ["8081:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro 
    depends_on: [server]

  server:
    build: ./server
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on: [redis]
    restart: unless-stopped 

  redis:
    image: redis:7-alpine