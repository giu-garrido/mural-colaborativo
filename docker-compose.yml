services:
  nginx:
    image: nginx:alpine
    ports: ["8081:80"]                 # porta 8081 do seu PC -> porta 80 do container
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # nossa config substitui a padrão
    depends_on: [server]

  server:
    build: ./server
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on: [redis]

  redis:
    image: redis:7-alpine