upstream mural_backend {
    server server:3000;
}

server {
    listen 80;

    # 1) Arquivos estáticos do frontend
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 2) Tudo que começa com /socket.io/ vai pro Node
    location /socket.io/ {
        proxy_pass http://mural_backend;
        proxy_http_version 1.1; # WebSocket exige HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # para HTTP -> WebSocket
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}